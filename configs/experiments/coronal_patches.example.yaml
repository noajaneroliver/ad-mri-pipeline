# 2D inputs: 64 x 64 inferior lateral patches (temporal lobes) of the
# 3 central coronal slices. Left patch mirrored -> 6 patches per subject.

dataset: ../datasets/adni.yaml
name: coronal_patches # output folder name

slices:
  view: coronal
  n_slices: 3
  patches:
    patch_size: 64
    margin_bottom: 28
    margin_side: 12
    mirror_left: true
  resize:
    method: null                  # patches are not resized
  normalization: {method: gaussian, fwhm: 6.0, pixel_size: 1.0}

run:
  n_jobs: 8
