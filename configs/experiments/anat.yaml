# Anatomical preprocessing of all subjects (step "anat"): skull stripping,
# registration to the template and, optionally, warping of the tissue maps.
# Run once per dataset.
#   python scripts/preprocess.py --config configs/experiments/anat.yaml --step anat

dataset: ../datasets/adni_all_subjects.yaml

derivatives:
  pipeline_name: admri
  space: MNI152NLin6Asym          # BIDS name of the FSL MNI152 template

skull_strip:
  method: hd-bet                  # hd-bet | bet-nipype | bet-fslpy

tissue_maps:
  enabled: true                   # also warp the CSF/GM/WM maps (needed for source: tissue_maps)
  interpolation: linear

run:
  n_jobs: 8
  threads_per_job: 3   # alfa server has 32 CPU cores, so 8 jobs x 3 threads = 24 threads in total, leaving some room for other processes
  overwrite: true
