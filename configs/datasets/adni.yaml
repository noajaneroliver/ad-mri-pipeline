# Dataset configuration: everything that is specific to one BIDS dataset.
# TODO: Replace every /path/to/ADNI with the actual path to the ADNI dataset.
bids_root: /path/to/ADNI/bids # folder of the ADNI BIDS dataset (the one with the sub-* folders)
# Optional. Default: <bids_root>/derivatives/admri
derivatives_root: /path/to/ADNI/derivatives/admri # a new folder for the outputs

bids:
  # Which subjects to process. If both are null, all sub-* folders.
  subjects: null                 # e.g. [ADNI002S0295, ADNI002S0413]
  subject_list: /path/to/ADNI/subjects.csv # CSV with the 902 subjects, or null to process every sub-*
  subject_column: subject
  # null = first session of each subject, "all" = every session, or a label.
  session: null
  datatype: anat
  suffix: T1w
  extension: .nii.gz
  # Extra pybids filters, e.g. {acquisition: MPRAGE}
  filters: {}
  # If several T1w match, preferred values in order (original rule: run-02 first).
  prefer:
    run: [2]
  # pybids index cache: the first run indexes the dataset, later runs are fast.
  database_path: /path/to/ADNI/derivatives/pybids_index # where to save the pybids index (e.g. inside the derivatives folder)

group_tools:
  # Folder with the group's fun_defs.py and logwrapper.py
  path: /pool/home/AD_Multimodal/Estudio_A4/codes_marina/Scripts_Preproc_Homebrew # CHECK THIS PATH
  # Folder with the hd-bet executable (prepended to PATH)
  bin_path: /home/biofisica/anaconda3/bin # /path/to/anaconda3/bin folder with hd-bet, or null if which hd-bet already finds it

registration:
  template: /pool/home/AD_Multimodal/ADNI/homebrew2/homebrew_preprocessing_scripts/atlas_ref/MNI152_T1_1mm_brain.nii.gz

tissue_maps: # only if I want the tissue maps: folder and name pattern of the FAST segmentations
  # Native-space FAST segmentations. {subject} and {session} are replaced.
  segmentation_dir: /path/to/ADNI/segmentations/sub-{subject}/ses-{session}
  pattern: "sub-{subject}_ses-{session}*_T1w_fast_seg_pve_{pve}.nii.gz"
