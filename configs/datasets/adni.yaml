# Dataset configuration: everything that is specific to one BIDS dataset.
bids_root: /pool/home/AD_Multimodal/ADNI/ADNI-BIDS # folder of the ADNI BIDS dataset
# Optional. Default: <bids_root>/derivatives/admri
derivatives_root: /pool/home/AD_Multimodal/PREVENT-AD/Folder_Noa/derivatives/admri # a new folder for the outputs

bids:
  # Optional: only these subjects from the CSV, null = every row of the CSV.
  subjects: [ADNI002S0295]                 # e.g. [ADNI002S0295, ADNI002S0413]
  # REQUIRED: CSV with columns "subject" and "session"; one image per row.
  subject_list: /pool/home/AD_Multimodal/ADNI/irene_adni/subjects_tfm_irene_filtered_all.csv # CSV with the 902 subjects, or null to process every sub-*
  datatype: anat
  suffix: T1w
  extension: .nii.gz
  # Extra pybids filters, e.g. {acquisition: MPRAGE}
  filters: {}
  # If several T1w match, preferred values in order (original rule: run-02 first).
  prefer:
    run: [2]
  # pybids index cache: the first run indexes the dataset, later runs are fast.
  database_path: /pool/home/AD_Multimodal/PREVENT-AD/Folder_Noa/derivatives/pybids_index # where to save the pybids index

group_tools:
  # Folder with the group's fun_defs.py and logwrapper.py
  path: /pool/home/AD_Multimodal/Estudio_A4/codes_marina/Scripts_Preproc_Homebrew # Folder with the hd-bet executable
  bin_path: null # /path/to/anaconda3/bin folder with hd-bet

registration:
  template: /pool/home/AD_Multimodal/ADNI/homebrew2/homebrew_preprocessing_scripts/atlas_ref/MNI152_T1_1mm_brain.nii.gz

tissue_maps: # only if I want the tissue maps: folder and name pattern of the FAST segmentations
  # Native-space FAST segmentations. {subject} and {session} are replaced.
  # sel*: search selA/B/C. Subjects can repeat across folders, but each sub/ses pair is in only one.
  segmentation_dir: /pool/home/AD_Multimodal/ADNI/ADNI-BIDS/homebrew2/test_preproc04_sel*/derivatives/anat/sub-{subject}/ses-{session}/segmentation
  pattern: "sub-{subject}_ses-{session}*_T1w_fast_seg_pve_{pve}.nii.gz"